[project]
name = "rusttorch-tooling"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.5.2",
    "safetensors==0.8.0",
    "torch==2.13.0",
]

[dependency-groups]
dev = [
    "myst-nb==1.4.0",
    "myst-parser==5.1.0",
    "pyyaml==6.0.3",
    "sphinx==9.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
