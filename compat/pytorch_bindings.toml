# Binding availability for the shipping PyTorch inventory.
# The trace joins tch src/wrappers/tensor_fallible_generated.rs to torch-sys
# src/c_generated.rs and libtch/torch_api_generated.cpp at tch_commit.
# Only direct dispatcher calls that agree with the exact schema in tch
# third_party/pytorch/Declarations-v2.13.0.yaml and the runtime ATen/ops
# headers qualify. Source availability does not certify all options or devices.
# For example f_add and f_add_scalar use the native default alpha of 1.
# Run scripts/trace-tch-dispatch.py to reproduce the table. The recorded trace
# used Apple clang 21.0.0 (clang-2100.3.34.2), arm64-apple-darwin27.0.0, -O1.
