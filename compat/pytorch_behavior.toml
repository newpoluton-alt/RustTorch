format_version = 1
pytorch_commit = "cf30153c4c131c8164ee7798e5022d810682e2cb"
observations = ["compat/results/index-select-macos-arm64.json"]

[[case]]
id = "index-select.repeated-rows.backward"
inventory_id = "python:torch.index_select"
ledger = "core.tensor.indexing"
profile = "native"
dtype = "float32"
layout = "strided"
options = "Select rows [2, 0, 2] from a contiguous 3 by 2 leaf with int64 indices, then sum the squared outputs and backpropagate."
expected = "The output contains the selected rows in order. The gradient accumulates both selections of row 2; row 1 receives zero."
observe = { metadata = ["shape", "stride", "gradient_shape", "gradient_stride"], values = { selected = 6, gradient = 6 } }
tolerance = { rtol = 0.0, atol = 0.0 }
implementation_sources = ["src/tensor.rs"]
rust_test = "tests/behavior_index_select.rs::repeated_rows_backward"
reference_test = "tests/python_reference/behavior_index_select.py::test_repeated_rows_backward"
documentation = "docs/tensor-workflows.md"
devices = { cpu = "pass", mps = "pass", cuda = "untested" }

[[case]]
id = "index-select.rejects-float-indices"
inventory_id = "python:torch.index_select"
ledger = "core.tensor.indexing"
profile = "native"
dtype = "float32"
layout = "strided"
options = "Select a row from a two-element vector with float32 indices."
expected = "The call returns an index dtype error and leaves both input values intact."
observe = { metadata = ["error", "shape"], values = { input_after_error = 2 } }
tolerance = { rtol = 0.0, atol = 0.0 }
implementation_sources = ["src/tensor.rs"]
rust_test = "tests/behavior_index_select.rs::rejects_float_indices"
reference_test = "tests/python_reference/behavior_index_select.py::test_rejects_float_indices"
documentation = "docs/tensor-workflows.md"
devices = { cpu = "pass", mps = "pass", cuda = "untested" }

[[case]]
id = "rms-norm.noncontiguous-tokens.backward"
inventory_id = "python:torch.nn.RMSNorm.forward"
ledger = "nn.normalization.rms_norm"
profile = "native"
dtype = "float32"
layout = "strided"
options = "Normalize the last two axes of a noncontiguous 2 by 2 by 3 input, use the native default epsilon and a learned scale, then backpropagate a sum and reset scale."
expected = "The functional and module results match. Both operands receive gradients and reset restores each registered scale element to one."
observe = { metadata = ["shape", "input_stride", "output_stride", "input_gradient_stride", "weight_shape"], values = { output = 12, input_gradient = 12, weight_gradient = 6, reset_weight = 6 } }
tolerance = { rtol = 1e-5, atol = 1e-6 }
rust_test = "tests/behavior_rms_norm.rs::trainable_noncontiguous_token_features"
reference_test = "tests/python_reference/behavior_rms_norm.py::test_trainable_noncontiguous_token_features"
implementation_sources = ["src/nn/normalization.rs", "src/nn/functional.rs"]
documentation = "docs/training.md"
devices = { cpu = "untested", mps = "untested", cuda = "untested" }
