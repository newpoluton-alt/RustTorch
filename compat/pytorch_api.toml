[[api]]
id = "amp"
python_symbols = ["torch.amp.autocast", "torch.amp.GradScaler"]
rust_symbols = ["rusttorch::amp::autocast", "rusttorch::amp::autocast_for", "rusttorch::amp::GradScaler", "rusttorch::amp::GradScalerConfig", "rusttorch::amp::GradScalerState"]
status = "partial"
implementation = "mixed"
scope = "CPU-tested dense gradient scaling, accumulation, optional unscale and clipping, finite-update checks, skipped nonfinite updates, growth/backoff, disabled execution, validated step ordering, and versioned scaler state. The CUDA autocast scope exposes native nesting and unwind restoration with explicit device selection."
source = "torch/amp/autocast_mode.py"
evidence = ["tests/amp.rs::scaling_preserves_updates_skips_nonfinite_steps_and_replays_state", "tests/amp.rs::scaler_enforces_step_order_and_validates_before_restore", "tests/amp.rs::scaler_supports_accumulation_clipping_and_disabled_execution", "tests/amp.rs::autocast_preserves_results_and_strict_device_policy", "tests/amp.rs::grad_scaler_matches_python_growth_backoff_and_updates", "tests/amp.rs::cuda_autocast_restores_dtype_after_nesting_and_unwind"]
notes = "Numerical scaler evidence is CPU only; torch/amp/grad_scaler.py supplies the pinned scaling reference. The CUDA test explicitly skips without CUDA and is not a verified CUDA pass here. CPU/BFloat16 and MPS autocast policies, dtype/cache selection, sparse scaling, multi-optimizer cycles, and every upstream scale-extreme behavior are not claimed. Rust scale bounds prevent zero/infinite stored multipliers. Python parity requires scripts/run-python-parity.sh."

