notes = "rusttorch-data owns the direct samplers and rusttorch::data preserves them. Concrete samplers and BatchSampler over an iterator remain ordinary one-shot Iterator values for source compatibility, while Sampler and BatchSource create fresh iterators for owned-loader epochs. Randomness uses sampler-local ChaCha12 state and never LibTorch's global RNG; deterministic RustTorch seeds do not provide exact PyTorch Philox sequence parity."

[[api]]
id = "data.sampler.distributed"
python_symbols = ["torch.utils.data.DistributedSampler"]
rust_symbols = ["rusttorch_data::DistributedSampler", "rusttorch::data::DistributedSampler"]
status = "supported"
implementation = "rusttorch"
scope = "Explicit replica/rank sharding over finite usize index ranges, with equal per-rank lengths, cyclic padding or global-tail truncation, deterministic epoch-aware optional shuffling, fresh reusable iterations, and direct-iterator position reporting. Empty datasets yield no indices on every valid rank, and invalid or unrepresentable dimensions return typed configuration errors."
