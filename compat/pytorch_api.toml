source = "torch/optim/optimizer.py"
evidence = ["tests/optim_state.rs::all_optimizer_moments_and_group_settings_resume_exactly_at_every_step", "tests/optim_state.rs::optimizer_checkpoint_validation_rejects_corruption_before_any_mutation", "tests/optim_state.rs::dynamic_registration_and_undefined_gradients_preserve_group_and_skip_semantics", "tests/optim_state.rs::gradient_validation_and_sparse_rejection_happen_before_any_update", "tests/optim_state.rs::checkpoint_capture_rejects_parameter_dtype_or_shape_drift", "tests/optim_state.rs::pinned_python_optimizer_and_scheduler_parity"]
