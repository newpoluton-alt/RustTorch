[[api]]
id = "autograd.functional"
python_symbols = ["torch.autograd.grad", "torch.autograd.functional.vjp", "torch.autograd.functional.jvp", "torch.autograd.functional.jacobian", "torch.autograd.functional.hessian"]
rust_symbols = ["rusttorch::autograd::GradOptions", "rusttorch::autograd::grad", "rusttorch::autograd::vjp", "rusttorch::autograd::jvp", "rusttorch::autograd::jacobian", "rusttorch::autograd::hessian"]
status = "partial"
implementation = "mixed"
scope = "Dense real single-input functional derivatives: scalar gradients without leaf-buffer accumulation; fixed-cotangent VJP; reverse-over-reverse JVP; Jacobians shaped output-shape plus input-shape; scalar Hessians and optional higher-order graphs. Constant/unused functional inputs produce zero derivatives, while direct grad rejects disconnected inputs."
source = "torch/autograd/functional.py"
evidence = ["tests/autograd.rs::gradients_preserve_leaf_buffers_and_support_higher_orders", "tests/autograd.rs::vector_products_and_jacobian_hessian_match_analytic_derivatives", "tests/autograd.rs::constant_unused_empty_and_multidimensional_derivatives_are_defined", "tests/autograd.rs::functional_derivatives_match_pinned_python"]
notes = "CPU Double numerical parity uses scripts/run-python-parity.sh. No native dual tensors, vectorized transforms, complex differentiation, batched gradients, or arbitrary custom Function hooks. Jacobians use one backward pass per output element; JVP requires native double-backward support. Tangent/cotangent seeds are detached. Native operation errors propagate."

[[api]]
id = "autograd.reverse_mode"
python_symbols = ["torch.Tensor.backward", "torch.no_grad", "torch.Tensor.detach", "torch.autograd.grad_mode.no_grad"]
rust_symbols = ["rusttorch_core::Tensor", "rusttorch_core::no_grad", "rusttorch_core::no_grad_guard", "rusttorch::Tensor", "rusttorch::no_grad", "rusttorch::no_grad_guard"]
status = "partial"
implementation = "libtorch"
scope = "Reverse-mode gradients through the tested eager and graph operations, plus tested no-grad and detach behavior."
source = "torch/autograd/__init__.py"
evidence = ["tests/eager.rs::gradients_accumulate_across_eager_residual_branches", "tests/eager.rs::no_grad_and_detach_stop_gradient_recording"]
notes = "rusttorch-core owns these direct reexports and the rusttorch facade preserves them; LibTorch owns autograd, while hooks, custom Function, forward AD, and the rest of the Python surface remain outside this claim."

[[api]]
id = "autograd.surrogate"
python_symbols = ["torch.Tensor.detach"]
rust_symbols = ["rusttorch::autograd::with_surrogate_gradient"]
status = "supported"
implementation = "mixed"
scope = "Algebraic custom-gradient composition for same-shape/dtype/device dense real tensors: exact detached forward value plus surrogate minus detached surrogate. The surrogate must be finite; its autograd graph supplies derivatives."
source = "torch/_tensor.py"
evidence = ["tests/autograd.rs::surrogate_derivatives_preserve_forward_values_and_validate_boundaries"]
notes = "This is a Rust composition recipe over ordinary tensor operations, not Python autograd.Function registration, saved-tensor hooks, or native custom backward callbacks."

