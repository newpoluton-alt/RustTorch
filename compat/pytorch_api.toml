format_version = 1
package = "rusttorch"
crate = "rusttorch"
tch = "0.26.0"
pytorch_reference = "v2.13.0"
pytorch_commit = "cf30153"
python_parity = "verified on CPU: strict bidirectional SafeTensors, Linear/residual forward and gradients, CE, MSE, one Adam and SGD step"

[[api]]
python_symbol = "torch.Tensor / torch.device / torch.dtype / torch.nn.functional reduction"
rust_symbol = "rusttorch::{Tensor, Device, Kind, Reduction}"
source = "tch public API"
reference = "PyTorch v2.13.0 (cf30153)"
implementation = "reexport"
support = "mvp"
differences = "Rust uses tch enums and methods directly."
tests = ["root reexport compile tests"]

[[api]]
python_symbol = "torch.manual_seed"
rust_symbol = "rusttorch::manual_seed"
source = "torch/random.py"
reference = "PyTorch v2.13.0 (cf30153)"
implementation = "delegate"
support = "mvp"
differences = "Delegates to tch; cross-language RNG stream identity is not promised."
tests = ["deterministic Rust tests"]

[[api]]
python_symbol = "torch.nn.Module"
rust_symbol = "rusttorch::nn::Module"
source = "torch/nn/modules/module.py"
reference = "PyTorch v2.13.0 (cf30153)"
implementation = "composite_port"
support = "mvp"
differences = "Rust trait and ownership replace Python dynamic attributes and hooks."
tests = ["eager forward, train/eval, residual autograd"]

[[api]]
python_symbol = "torch.nn.Linear"
rust_symbol = "rusttorch::nn::{Linear, LinearConfig, linear}"
source = "torch/nn/modules/linear.py"
reference = "PyTorch v2.13.0 (cf30153)"
implementation = "composite_port"
support = "mvp"
differences = "Configuration is expressed by Rust constructors/builders; computation delegates to tch."
state_dict = ["weight", "bias"]
tests = ["shape, bias/no-bias, deterministic output, gradients, naming"]

[[api]]
python_symbol = "torch.nn.Identity"
rust_symbol = "rusttorch::nn::Identity"
source = "torch/nn/modules/linear.py"
reference = "PyTorch v2.13.0 (cf30153)"
implementation = "delegate"
support = "mvp"
differences = "No arbitrary ignored Python arguments."
tests = ["eager and graph identity"]

