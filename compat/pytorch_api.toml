reference = "PyTorch v2.13.0 (cf30153)"
implementation = "interop"
support = "mvp"
differences = "Exact and safe prefix mapping only; no fuzzy matching or implicit tensor transforms."
tests = ["mapping, duplicate destination, dry run"]

[[api]]
python_symbol = "safetensors.torch.save_file / load_file"
