[package]
name = "rusttorch-tabular"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Typed tabular pipelines for RustTorch"
readme = "README.md"
documentation = "https://docs.rs/rusttorch-tabular"
publish = ["crates-io"]

[features]
default = []
download-libtorch = ["rusttorch-core/download-libtorch"]
doc-only = ["rusttorch-core/doc-only"]
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc"]
parquet = ["arrow", "dep:parquet"]

[dependencies]
rusttorch-core.workspace = true
rusttorch-data.workspace = true
thiserror.workspace = true
tch.workspace = true
serde.workspace = true
csv = "=1.4.0"
serde_json.workspace = true
arrow-array = { version = "=59.3.0", optional = true }
arrow-schema = { version = "=59.3.0", optional = true }
arrow-ipc = { version = "=59.3.0", default-features = false, optional = true }
parquet = { version = "=59.3.0", default-features = false, features = ["arrow"], optional = true }

[package.metadata.docs.rs]
no-default-features = true
features = ["doc-only", "parquet"]
