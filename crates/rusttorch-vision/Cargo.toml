[package]
name = "rusttorch-vision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Typed vision pipelines for RustTorch"
readme = "README.md"
documentation = "https://docs.rs/rusttorch-vision"
publish = ["crates-io"]

[features]
default = []
download-libtorch = ["rusttorch-core/download-libtorch"]
doc-only = ["rusttorch-core/doc-only"]

[dependencies]
rusttorch-core.workspace = true
rusttorch-data.workspace = true
thiserror.workspace = true
tch.workspace = true
serde.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
serde_json.workspace = true

[package.metadata.docs.rs]
no-default-features = true
features = ["doc-only"]
