name: Feature request
description: Propose a scoped RustTorch improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Explain the user need before proposing API. Large work requires agreement before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete use case and why current RustTorch or tch APIs do not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest public behavior that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and evidence
      description: List APIs, backends, tests, documentation, and compatibility entries that would change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Explain existing RustTorch, tch, standard-library, or application-level alternatives considered.
    validations:
      required: true
  - type: textarea
    id: pytorch_reference
    attributes:
      label: PyTorch reference
      description: Give symbols, version, source paths, and documented differences, or explain why no PyTorch analogue applies.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and confirmed this proposal is not a duplicate.
          required: true
        - label: I have read and will follow the Code of Conduct.
          required: true
        - label: This request contains no security vulnerability or sensitive data.
          required: true
