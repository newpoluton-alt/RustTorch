name: Bug report
description: Report a reproducible RustTorch defect
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Use the Security form link instead for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: RustTorch version or commit
      description: Give the exact crate version or Git commit.
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Rust, OS, architecture, hardware, LibTorch or PyTorch, tch, and install method.
      placeholder: "rustc, OS/arch, CPU/GPU, driver, LibTorch/PyTorch, tch, setup command"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - CPU
        - MPS
        - CUDA
        - Other or backend-independent
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest complete code and commands that reproduce the defect.
      render: rust
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the result you expected and the PyTorch reference when relevant.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the complete error and logs with secrets and personal data removed.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have read and will follow the Code of Conduct.
          required: true
        - label: This report contains no security vulnerability or sensitive data.
          required: true
