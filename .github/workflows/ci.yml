name: Qualify the PyTorch 2.14 candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Training and checkpoint restore / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Synchronize locked Python environment
        run: uv sync --locked --no-dev --no-cache

      - name: Set up the workspace Rust floor
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.88.0
          cache: false

      - name: Export Unix LibTorch library path
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          torch_lib="$(.venv/bin/python -c 'from pathlib import Path; import torch; print(Path(torch.__file__).resolve().parent / "lib")')"
          echo "LIBTORCH_USE_PYTORCH=1" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "DYLD_LIBRARY_PATH=${torch_lib}" >> "$GITHUB_ENV"
          else
            echo "LD_LIBRARY_PATH=${torch_lib}" >> "$GITHUB_ENV"
          fi

      - name: Export Windows LibTorch library path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXXFLAGS=$env:CXXFLAGS /EHsc" | Out-File -FilePath $env:GITHUB_ENV -Append
          # This upstream MSBuild-only option is ignored by cl.exe, not Clang.
          "CCC_OVERRIDE_OPTIONS=x/p:DefineConstants=GLOG_USE_GLOG_EXPORT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VIRTUAL_ENV=$PWD/.venv" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$PWD/.venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
          $torchLib = .venv/Scripts/python.exe -c "from pathlib import Path; import torch; print(Path(torch.__file__).resolve().parent / 'lib')"
          "LIBTORCH_USE_PYTORCH=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          $torchLib | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify CPU runtime and binding fingerprints
        shell: python
        run: |
          import os, platform, sys, tomllib
          from pathlib import Path
          from urllib.parse import unquote
          import torch

          ref = "2b3ec34829036a65cd9d1398ea72a0167dc37470"
          # Release wheels were cut before the tag's final test-only import.
          assert torch.version.git_version in {"08187d9e0fba026dc8217405802ab5381dc88d90", ref}, torch.version.git_version
          assert torch.__version__.split("+")[0] == "2.14.0", torch.__version__
          assert "LIBTORCH_BYPASS_VERSION_CHECK" not in os.environ
          suffix = {
              "linux": "-cp314-cp314-manylinux_2_28_x86_64.whl",
              "darwin": "-cp314-cp314-macosx_14_0_arm64.whl",
              "win32": "-cp314-cp314-win_amd64.whl",
          }[sys.platform]
          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          wheel, = [w for p in lock["package"] if p["name"] == "torch" and p["version"] == torch.__version__
                    for w in p["wheels"] if w["url"].endswith(suffix)]
          bindings = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))["package"]
          rev = "b75d71aa421ab38983184bd71cd1708dac669fc8"
          for name in ["tch", "torch-sys"]:
              package, = [p for p in bindings if p["name"] == name]
              assert package["version"] == "0.27.0" and package["source"].endswith("#" + rev), package
          print(f"{platform.platform()} / Python {platform.python_version()}")
          print(f"Runtime {torch.__version__} ({torch.version.git_version}); candidate binding {rev}")
          print(unquote(wheel["url"].split("/")[-1]), wheel["hash"])
          print(torch.__config__.show())

      - name: Train, save, restore and compare the next CPU update
        run: cargo run --locked -p rusttorch --no-default-features --example training_checkpoint
