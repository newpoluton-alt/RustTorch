name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out complete pull-request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_DEPENDABOT_ACTOR: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          if [ "$TRUSTED_DEPENDABOT_ACTOR" = "true" ]; then
            python3 scripts/check-dco.py --base "$BASE_SHA" --head "$HEAD_SHA" \
              --trusted-dependabot-actor
          else
            python3 scripts/check-dco.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
        with:
          comment-summary-in-pr: never

  quality:
    name: Stable quality
    runs-on: ubuntu-latest
    env:
      LIBTORCH_USE_PYTORCH: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate Python lock artifacts
        run: python3 scripts/check-python-lock.py

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Validate Python dependency lock
        run: uv lock --check --offline --no-cache

      - name: Synchronize locked Python environment
        run: uv sync --frozen --no-cache

      - name: Export project Python environment
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          cache: false
          components: rustfmt, clippy

      - name: Export LibTorch library path
        run: |
          torch_lib="$(.venv/bin/python -c 'from pathlib import Path; import torch; print(Path(torch.__file__).resolve().parent / "lib")')"
          echo "LD_LIBRARY_PATH=${torch_lib}" >> "$GITHUB_ENV"

      - name: Run Python policy tests
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate compatibility ledger
        run: .venv/bin/python scripts/check-compatibility.py --check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Check rusttorch-data feature combinations
        run: |
          cargo check -p rusttorch-data --all-targets --locked --no-default-features
          cargo check -p rusttorch-data --all-targets --locked --no-default-features --features doc-only
          cargo check -p rusttorch-data --all-targets --locked --no-default-features --features download-libtorch
          cargo check -p rusttorch-data --all-targets --locked --all-features

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Test documentation examples
        run: cargo test --workspace --doc --locked

      - name: Run training checkpoint example
        run: cargo run --example training_checkpoint --locked

      - name: Enforce Python parity
        run: scripts/run-python-parity.sh

      - name: Build rusttorch documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p rusttorch --no-deps --locked

      - name: Build rusttorch-cli documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p rusttorch-cli --no-deps --locked

      - name: Build rusttorch-core documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc -p rusttorch-core --no-deps --locked --no-default-features
          --features doc-only

      - name: Build rusttorch-data documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc -p rusttorch-data --no-deps --locked --no-default-features
          --features doc-only

      - name: Check docs.rs configuration
        run: >-
          cargo check -p rusttorch --all-targets --locked --no-default-features
          --features doc-only

      - name: Build docs.rs documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc -p rusttorch --no-deps --locked --no-default-features
          --features doc-only

      - name: Inspect rusttorch-core package
        run: cargo package -p rusttorch-core --locked --list | tee "$RUNNER_TEMP/rusttorch-core-package-files.txt"

      - name: Inspect rusttorch-data package
        run: cargo package -p rusttorch-data --locked --list | tee "$RUNNER_TEMP/rusttorch-data-package-files.txt"

      - name: Inspect rusttorch package
        run: cargo package -p rusttorch --locked --list | tee "$RUNNER_TEMP/rusttorch-package-files.txt"

      - name: Inspect rusttorch-cli package
        run: cargo package -p rusttorch-cli --locked --list | tee "$RUNNER_TEMP/rusttorch-cli-package-files.txt"

      - name: Reject unsafe package contents
        run: |
          if grep -E '(^|/)(\.venv|target|__pycache__|libtorch)(/|$)|(^|/)(pyproject\.toml|uv\.lock)$|\.(pyc|pyo|so|dylib|dll)$' \
            "$RUNNER_TEMP/rusttorch-core-package-files.txt" \
            "$RUNNER_TEMP/rusttorch-data-package-files.txt" \
            "$RUNNER_TEMP/rusttorch-package-files.txt" \
            "$RUNNER_TEMP/rusttorch-cli-package-files.txt"; then
            echo "error: package contains Python tooling or a generated/native environment artifact" >&2
            exit 1
          fi

      # Packaging needs Cargo 1.90+; the crate MSRV remains Rust 1.88 and is check-only below.
      - name: Verify workspace archives
        run: cargo package --workspace --locked

  msrv:
    name: MSRV / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - rusttorch-core
          - rusttorch-data
          - rusttorch
          - rusttorch-cli
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust 1.88
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: "1.88"
          cache: false

      - name: Check library package on the MSRV
        if: matrix.package != 'rusttorch-cli'
        run: >-
          cargo check -p ${{ matrix.package }} --all-targets --locked
          --no-default-features --features doc-only

      - name: Check CLI package on the MSRV
        if: matrix.package == 'rusttorch-cli'
        run: cargo check -p rusttorch-cli --all-targets --locked

  cli:
    name: CLI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          cache: false

      - name: Test the setup CLI
        run: cargo test -p rusttorch-cli --all-targets --locked

  loader-platform:
    name: Data loader / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Synchronize locked Python environment
        run: uv sync --frozen --no-cache

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          cache: false

      - name: Export Unix LibTorch library path
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          torch_lib="$(.venv/bin/python -c 'from pathlib import Path; import torch; print(Path(torch.__file__).resolve().parent / "lib")')"
          echo "LIBTORCH_USE_PYTORCH=1" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "DYLD_LIBRARY_PATH=${torch_lib}" >> "$GITHUB_ENV"
          else
            echo "LD_LIBRARY_PATH=${torch_lib}" >> "$GITHUB_ENV"
          fi

      - name: Export Windows LibTorch library path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Keep torch-sys's C++17 mode: Clang supports the header extensions
          # without treating the binding's `module` typedef as C++20 syntax.
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXXFLAGS=$env:CXXFLAGS /EHsc" | Out-File -FilePath $env:GITHUB_ENV -Append
          # This upstream MSBuild-only option is ignored by cl.exe, not Clang.
          "CCC_OVERRIDE_OPTIONS=x/p:DefineConstants=GLOG_USE_GLOG_EXPORT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VIRTUAL_ENV=$PWD/.venv" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$PWD/.venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
          $torchLib = .venv/Scripts/python.exe -c "from pathlib import Path; import torch; print(Path(torch.__file__).resolve().parent / 'lib')"
          "LIBTORCH_USE_PYTORCH=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          $torchLib | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Test loader runtime and conditional CUDA pinning
        run: cargo test -p rusttorch-data --tests --locked

      - name: Run loader examples
        run: |
          cargo run -p rusttorch-data --example loader --locked
          cargo run -p rusttorch-data --example checkpoint --locked

  loader-stress:
    name: Data loader stress
    runs-on: ubuntu-latest
    env:
      LIBTORCH_USE_PYTORCH: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Synchronize locked Python environment
        run: uv sync --frozen --no-cache

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          cache: false

      - name: Export LibTorch library path
        run: |
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          torch_lib="$(.venv/bin/python -c 'from pathlib import Path; import torch; print(Path(torch.__file__).resolve().parent / "lib")')"
          echo "LD_LIBRARY_PATH=${torch_lib}" >> "$GITHUB_ENV"

      - name: Repeat deterministic lifecycle and checkpoint tests
        run: |
          for pass in 1 2 3; do
            cargo test -p rusttorch-data --locked --test worker_lifecycle --test checkpoint_map --test checkpoint_stream
          done

  required:
    name: required
    if: always()
    needs:
      - dco
      - dependency-review
      - quality
      - msrv
      - cli
      - loader-platform
      - loader-stress
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check
        env:
          EVENT_NAME: ${{ github.event_name }}
          DCO_RESULT: ${{ needs.dco.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          LOADER_PLATFORM_RESULT: ${{ needs.loader-platform.result }}
          LOADER_STRESS_RESULT: ${{ needs.loader-stress.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$MSRV_RESULT" = "success"
          test "$CLI_RESULT" = "success"
          test "$LOADER_PLATFORM_RESULT" = "success"
          test "$LOADER_STRESS_RESULT" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$DCO_RESULT" = "success"
            test "$DEPENDENCY_REVIEW_RESULT" = "success"
          else
            test "$DCO_RESULT" = "skipped"
            test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
          fi
