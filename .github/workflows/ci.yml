name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    env:
      LIBTORCH_USE_PYTORCH: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Create project Python environment
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install PyTorch CPU runtime
        run: >-
          .venv/bin/python -m pip install 'torch==2.13.0'
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install parity dependencies
        run: .venv/bin/python -m pip install 'safetensors==0.8.0' 'numpy==2.5.2'

      - name: Export LibTorch library path
        run: |
          torch_lib="$(.venv/bin/python -c 'from pathlib import Path; import torch; print(Path(torch.__file__).resolve().parent / "lib")')"
          echo "LD_LIBRARY_PATH=${torch_lib}" >> "$GITHUB_ENV"

      - name: Validate compatibility ledger
        run: python3 scripts/check-compatibility.py --check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Enforce Python parity
        run: scripts/run-python-parity.sh

      - name: Build workspace documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Check docs.rs configuration
        run: >-
          cargo check -p rusttorch --all-targets --no-default-features
          --features tch/doc-only

      - name: Build docs.rs documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc -p rusttorch --no-deps --no-default-features
          --features tch/doc-only

      - name: Inspect rusttorch package
        run: cargo package -p rusttorch --locked --list

      - name: Inspect rusttorch-cli package
        run: cargo package -p rusttorch-cli --locked --list

  required:
    name: required
    if: always()
    needs:
      - quality
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = "success"
