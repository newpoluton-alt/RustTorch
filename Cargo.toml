[package]
name = "rusttorch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Build, train, and run neural networks in Rust with LibTorch"
documentation = "https://docs.rs/rusttorch"
repository.workspace = true
readme = "README.md"
keywords = ["pytorch", "libtorch", "machine-learning", "deep-learning", "autograd"]
categories = ["science", "api-bindings"]
license.workspace = true
publish = ["crates-io"]
exclude = [
    "/.serena",
    "/rustorch_codex_project_prompt.md",
    "/crates/rusttorch-cli",
    "/pyproject.toml",
    "/uv.lock",
    "**/__pycache__/**",
    "**/*.pyc",
]

[lib]
name = "rusttorch"

[workspace]
members = ["crates/*"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/newpoluton-alt/RustTorch"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tch = { version = "=0.26.0", default-features = false }
thiserror = "2.0"
rand = "0.8"
rand_chacha = "0.3"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusttorch-core = { version = "=0.2.0", path = "crates/rusttorch-core", default-features = false }
rusttorch-data = { version = "=0.2.0", path = "crates/rusttorch-data", default-features = false }

[features]
default = ["download-libtorch"]
download-libtorch = ["rusttorch-core/download-libtorch"]
doc-only = ["rusttorch-core/doc-only"]

[dependencies]
rusttorch-core.workspace = true
rusttorch-data.workspace = true
tch.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }

[package.metadata.docs.rs]
no-default-features = true
features = ["doc-only"]
